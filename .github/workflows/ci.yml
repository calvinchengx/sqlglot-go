# The port is measured against the Python reference on every push. The
# expectations are committed, so no job needs Python or sqlglot: a Go toolchain
# alone reproduces the differential run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  differential:
    name: Against the reference (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # The port has no dependencies and no native library, so it runs wherever
    # Go does -- but "should work on Windows" is a claim, and developers work
    # on Windows machines of both architectures. The differential run is the
    # same on every platform because the expectations are committed, so proving
    # it costs one job per target and nothing else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-latest
          - name: linux/arm64
            os: ubuntu-24.04-arm
          - name: macos/arm64
            os: macos-latest
          - name: windows/amd64
            os: windows-latest
          - name: windows/arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: differential run
        run: go test ./... -v

  coverage-and-lint:
    name: Coverage floor and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test coverage floor
        run: |
          go test ./... -coverpkg=./sqlglot/ -coverprofile=cover.out >/dev/null
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "coverage: $pct%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 95) { print "below the 95% floor"; exit 1 } }'
      # The README's tables are the coverage files, or they are a second copy
      # that drifts. `go test` above rewrites testdata/**/coverage.json from
      # the run it just did, so this compares the README against measurements
      # taken seconds ago rather than against whatever was committed.
      - name: the README's numbers are what was measured
        run: python3 harness/gen_readme.py --check
      # A crash in a parser that sits under a security guard is a denial of
      # service in front of a database, so this one runs on every build. Its
      # sibling, FuzzGeneratedSQLCanBeReadBack, is deliberately NOT here yet:
      # it has an open finding recorded on the target itself.
      # -fuzztime bounds the SEARCH; -timeout bounds the whole test binary. On
      # a loaded runner the two collided: the search hit its deadline while a
      # worker was mid-execution, and the step failed with "context deadline
      # exceeded" and NO failing input written -- a shutdown race, not a hang.
      # Confirmed by 37.8M local executions with no finding. A generous
      # -timeout leaves room for the last execution to finish and report.
      - name: a short fuzz for parser panics
        run: go test ./sqlglot/ -run=XXX -fuzz=FuzzParseOneNeverPanics -fuzztime=45s -timeout=10m
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: .

  # The committed expectations must be exactly what the pinned reference
  # produces. Regenerate and diff; a difference means someone edited an
  # expectation by hand, or regenerated against a commit NOTICE does not name.
  oracle-is-pinned:
    name: Expectations match the pinned reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check out the pinned reference
        run: |
          ref=$(grep -oE 'commit [0-9a-f]{40}' NOTICE | head -1 | cut -d' ' -f2)
          git clone -q https://github.com/tobymao/sqlglot /tmp/sqlglot
          git -C /tmp/sqlglot checkout -q "$ref"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: regenerate and diff
        run: |
          python3 harness/oracle.py --sqlglot /tmp/sqlglot --out /tmp/expected
          diff -rq testdata/expected /tmp/expected && echo "expectations are exactly the pinned reference's"
      # The tokenizer's keyword and dialect tables are generated from the same
      # pin. A hand-edited table would be a silent divergence from the
      # reference in the one place the port has no logic to catch it.
      # The batched differential, which is the only place the read-back
      # property can be a GATE rather than a discovery run.
      #
      # `FuzzGeneratedSQLCanBeReadBack` on its own cannot be one: three of its
      # findings turned out to be sqlglot doing the same thing, and a property
      # stronger than the oracle's reports the reference's behaviour as ours.
      # So the fuzzer collects, the adjudicator asks the reference about each
      # finding, and only a YOURS verdict -- the reference handles it, the port
      # does not -- fails the build. It exits non-zero on exactly that.
      #
      # 45 seconds found 96,096 findings collapsing to one real cause the first
      # time it ran. It now finds none.
      - name: fuzz the generator, and let the reference judge what it finds
        run: |
          DAS_FUZZ_COLLECT=/tmp/candidates.txt \
            go test ./sqlglot/ -run=XXX -fuzz=FuzzGeneratedSQLCanBeReadBack -fuzztime=45s
          if [ -s /tmp/candidates.txt ]; then
            sort -u /tmp/candidates.txt -o /tmp/candidates.txt
            python3 harness/adjudicate.py --sqlglot /tmp/sqlglot --candidates /tmp/candidates.txt
          else
            echo "the generator wrote nothing the parser could not read back"
          fi
      - name: the generated tables are the reference's
        run: |
          cp sqlglot/tokentype_gen.go sqlglot/dialects_gen.go sqlglot/parser_gen.go sqlglot/classes_gen.go /tmp/
          python3 harness/gen_tokenizer.py --sqlglot /tmp/sqlglot --out sqlglot
          python3 harness/gen_parser.py --sqlglot /tmp/sqlglot
          python3 harness/gen_classes.py --sqlglot /tmp/sqlglot > sqlglot/classes_gen.go
          gofmt -w sqlglot/tokentype_gen.go sqlglot/dialects_gen.go sqlglot/parser_gen.go sqlglot/classes_gen.go
          diff /tmp/tokentype_gen.go sqlglot/tokentype_gen.go
          diff /tmp/dialects_gen.go sqlglot/dialects_gen.go
          diff /tmp/parser_gen.go sqlglot/parser_gen.go
          diff /tmp/classes_gen.go sqlglot/classes_gen.go
          echo "generated tables are exactly the pinned reference's"

  # The one check here that can fail because two queries MEAN different
  # things rather than because two strings differ. Every other harness
  # compares trees or text against sqlglot, which proves the port agrees with
  # the reference and never that either is right.
  #
  # It is a separate job because it needs an engine. DuckDB in Go means cgo,
  # and the differential job above proves the port on five platforms with a
  # Go toolchain alone -- including Windows on arm64, where no such library
  # exists. So the engine stays on the Python side, as the reference does.
  execution-oracle:
    name: The port's SQL means what it was given
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DuckDB embeds; PostgreSQL needs a server, and a service container is
    # the cheapest one there is. Databricks has no local engine at all, and
    # the neutral dialect rewrites 8 statements out of 991 -- neither would
    # earn the infrastructure.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGDSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb 'psycopg[binary]'
      - name: run it through both engines and compare the rows
        run: make oracle-exec
