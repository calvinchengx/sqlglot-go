# The port is measured against the Python reference on every push. The
# expectations are committed, so no job needs Python or sqlglot: a Go toolchain
# alone reproduces the differential run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  differential:
    name: Against the reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: differential run, with the coverage floor
        run: go test ./... -v 2>&1 | grep -E "reference|neutral|tsql|postgres|duckdb|databricks|PASS|FAIL|ok|divergence" | head -40; go test ./...
      - name: test coverage floor
        run: |
          go test ./... -coverpkg=./sqlglot/ -coverprofile=cover.out >/dev/null
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "coverage: $pct%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 95) { print "below the 95% floor"; exit 1 } }'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: .

  # The committed expectations must be exactly what the pinned reference
  # produces. Regenerate and diff; a difference means someone edited an
  # expectation by hand, or regenerated against a commit NOTICE does not name.
  oracle-is-pinned:
    name: Expectations match the pinned reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check out the pinned reference
        run: |
          ref=$(grep -oE 'commit [0-9a-f]{40}' NOTICE | head -1 | cut -d' ' -f2)
          git clone -q https://github.com/tobymao/sqlglot /tmp/sqlglot
          git -C /tmp/sqlglot checkout -q "$ref"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: regenerate and diff
        run: |
          python3 harness/oracle.py --sqlglot /tmp/sqlglot --out /tmp/expected
          diff -rq testdata/expected /tmp/expected && echo "expectations are exactly the pinned reference's"
      # The tokenizer's keyword and dialect tables are generated from the same
      # pin. A hand-edited table would be a silent divergence from the
      # reference in the one place the port has no logic to catch it.
      - name: the generated tokenizer tables are the reference's
        run: |
          cp sqlglot/tokentype_gen.go sqlglot/dialects_gen.go /tmp/
          python3 harness/gen_tokenizer.py --sqlglot /tmp/sqlglot --out sqlglot
          gofmt -w sqlglot/tokentype_gen.go sqlglot/dialects_gen.go
          diff /tmp/tokentype_gen.go sqlglot/tokentype_gen.go
          diff /tmp/dialects_gen.go sqlglot/dialects_gen.go
          echo "tokenizer tables are exactly the pinned reference's"
